[package]
name = "arrano"
version = "0.2.0"
edition = "2021"
description = "Eagle view over your GitHub PRs — lazygit-style TUI on top of gh, with Claude Code reviews"
repository = "https://github.com/enekos/arrano"

[dependencies]
ratatui = "0.29"
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
lto = true
strip = true
